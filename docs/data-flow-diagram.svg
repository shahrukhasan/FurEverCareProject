    <rect x="70" y="510" width="260" height="110" rx="24" fill="#eefbf8" stroke="#36a995" stroke-width="3"/><text x="200" y="558" font-size="23" font-weight="700" fill="#245e55">Browser APIs</text><text x="200" y="588" font-size="17" fill="#5f5967">Clock • Geolocation • Audio</text>
    <rect x="870" y="100" width="260" height="110" rx="24" fill="#f3efff" stroke="#7d62d9" stroke-width="3"/><text x="1000" y="148" font-size="23" font-weight="700" fill="#4c377c">JSON Files</text><text x="1000" y="178" font-size="17" fill="#5f5967">Products • Pets • Cases</text>
