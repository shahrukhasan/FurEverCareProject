  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5c45c9"/></marker></defs>
  <rect width="1200" height="760" rx="34" fill="#fbf9ff"/>
  <text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#352a4a">FurEver Care - Data Flow Diagram</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="440" y="280" width="320" height="160" rx="30" fill="#6d4aff"/><text x="600" y="345" font-size="27" font-weight="700" fill="white">Browser SPA</text><text x="600" y="382" font-size="18" fill="#efeaff">JavaScript + jQuery</text>
